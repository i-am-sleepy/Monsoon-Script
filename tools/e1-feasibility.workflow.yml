name: E1 feasibility (side branch only)

# E1 Phase 0 (D49). Runs ONLY for pushes to the side branch `e1-feasibility`. It never publishes a release,
# never touches `ci-status` and uses its own concurrency group, so it cannot cancel or disturb a main build.
# Results are written to the branches `e1-status-build` and `e1-status-emulator` (file status.txt).
#
# This file lives in tools/ because the GitHub tool claude-e uses cannot create workflow files (403).
# To switch it on: rename/move it to .github/workflows/e1-feasibility.yml on THIS branch (GitHub web: open the file,
# pencil icon, change the file path, commit to e1-feasibility). Do NOT merge it into main as it is.

on:
  push:
    branches: [e1-feasibility]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e1-feasibility
  cancel-in-progress: true

env:
  KPDX_TAG: '4.5.8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Fetch KeePassDX (pinned release tag, never edited)
        run: git clone --depth 1 --branch "$KPDX_TAG" https://github.com/Kunzisoft/KeePassDX.git third_party/keepassdx

      - name: Android SDK pieces (platform 36, NDK, CMake)
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;25.2.9519653" "cmake;3.22.1" | tail -n 5

      - name: Build release APK (our shrinker on, like the real build)
        id: build
        run: |
          set -o pipefail
          gradle --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Upstream database unit tests (information only)
        id: utests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --stacktrace :database:testDebugUnitTest 2>&1 | tee utest.log

      - name: Publish status
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          UTEST_RESULT: ${{ steps.utests.outcome }}
        run: |
          d="$RUNNER_TEMP/st"; mkdir -p "$d"
          apk=app/build/outputs/apk/release/app-release.apk
          {
            echo "job: build (release APK + upstream unit tests)"
            echo "result: ${BUILD_RESULT:-not-run}"
            echo "upstream database unit tests: ${UTEST_RESULT:-not-run}"
            echo "upstream: KeePassDX ${KPDX_TAG}"
            echo "run: #${GITHUB_RUN_NUMBER} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit: $GITHUB_SHA"
            echo "time: $(date -u +%FT%TZ)"
            if [ -f "$apk" ]; then
              echo "release apk bytes: $(stat -c %s "$apk")"
              echo "main latest apk: $(curl -sIL https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/MonsoonScript.apk | grep -i '^content-length' | tail -1 | tr -d '\r')"
              echo "--- apk contents (native libs + dex) ---"
              unzip -l "$apk" | grep -E 'lib/|classes[0-9]*\.dex' || true
            fi
            if [ -f build.log ]; then
              echo
              echo "--- errors ---"
              grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|Missing class|missing_rules" -A6 build.log | head -120 || true
              echo
              echo "--- tail ---"
              tail -n 50 build.log
            fi
            if [ -f utest.log ]; then
              echo
              echo "--- upstream unit tests (tail) ---"
              tail -n 25 utest.log
            fi
          } > "$d/status.txt"
          cd "$d"
          git init -q -b e1-status-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add status.txt
          git commit -qm "E1 spike status for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e1-status-build

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Fetch KeePassDX (pinned release tag, never edited)
        run: git clone --depth 1 --branch "$KPDX_TAG" https://github.com/Kunzisoft/KeePassDX.git third_party/keepassdx

      - name: Android SDK pieces (platform 36, NDK, CMake)
        continue-on-error: true
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;25.2.9519653" "cmake;3.22.1" | tail -n 5

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented spike test on an emulator (native Argon2 + KDBX round trip)
        id: emu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle --stacktrace :vault:connectedDebugAndroidTest > emu.log 2>&1

      - name: Publish status
        if: always()
        env:
          EMU_RESULT: ${{ steps.emu.outcome }}
        run: |
          d="$RUNNER_TEMP/st"; mkdir -p "$d"
          {
            echo "job: emulator (instrumented spike test, API 34 x86_64)"
            echo "result: ${EMU_RESULT:-not-run}"
            echo "upstream: KeePassDX ${KPDX_TAG}"
            echo "run: #${GITHUB_RUN_NUMBER} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit: $GITHUB_SHA"
            echo "time: $(date -u +%FT%TZ)"
            echo "--- test results ---"
            find vault/build -name 'TEST-*.xml' 2>/dev/null | head -3 | xargs -r grep -h -E "<testsuite |<testcase |<failure|<error" | cut -c1-400 | head -40 || true
            if [ -f emu.log ]; then
              echo
              echo "--- errors ---"
              grep -nE "^e: |error:|FAILED|What went wrong|Execution failed|UnsatisfiedLink|Exception" -A6 emu.log | head -120 || true
              echo
              echo "--- tail ---"
              tail -n 60 emu.log
            fi
          } > "$d/status.txt"
          cd "$d"
          git init -q -b e1-status-emulator
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add status.txt
          git commit -qm "E1 spike status for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e1-status-emulator
