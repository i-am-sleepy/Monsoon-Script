name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'third_party/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The voice engine source (G5) and the KeePassDX engine (E1.13: the app now depends on :vault, which builds its :crypto and :database modules).
      - name: Fetch the engine sources (third_party/transcribe.cpp, third_party/keepassdx)
        run: git submodule update --init --depth 1 third_party/transcribe.cpp third_party/keepassdx

      - name: Android SDK pieces (platform 36 for the KeePassDX modules, NDK and CMake for the native engines)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "ndk;25.2.9519653" "cmake;3.22.1" | tail -n 5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'   # AGP 8.13.2 (needed by the KeePassDX modules, E1) requires Gradle 8.13+

      - name: Prepare signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=release key" >> "$GITHUB_OUTPUT"
          else
            echo "signed=TEMPORARY debug key - add the KEYSTORE secrets, then updates can install over each other" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        id: tests
        run: |
          set -o pipefail
          gradle --stacktrace :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Build release APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --stacktrace :app:assembleRelease 2>&1 | tee build.log

      - name: Publish rolling release
        if: steps.build.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MonsoonScript.apk
          {
            echo "Build #${{ github.run_number }} from commit ${GITHUB_SHA::7}"
            echo
            git log -1 --pretty=%s
            echo
            echo "Signed with: $SIGNED"
          } > notes.txt
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest MonsoonScript.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" --notes-file notes.txt

      - name: Publish CI status
        if: always() && github.ref == 'refs/heads/main'
        env:
          RESULT: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          d="$RUNNER_TEMP/ci-status"
          mkdir -p "$d"
          {
            if [ "$TESTS" != "success" ]; then RESULT="FAILED (unit tests: ${TESTS:-not-run})"; fi
            echo "result: ${RESULT:-not-run}"
            echo "tests: ${TESTS:-not-run}"
            echo "run: #${{ github.run_number }} ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: $GITHUB_SHA"
            echo "signed: $SIGNED"
            echo "time: $(date -u +%FT%TZ)"
            if [ "$TESTS" != "success" ] && [ -f test.log ]; then
              echo
              echo "--- test failures ---"
              grep -nE "FAILED|AssertionError|ComparisonFailure|expected:|^e: |What went wrong" -A3 test.log | head -80 || true
              echo
              echo "--- test tail ---"
              tail -n 30 test.log
            fi
            if [ -f build.log ]; then
              echo
              echo "--- errors ---"
              grep -nE "^e: |error:|FAILED|What went wrong|Execution failed" -A4 build.log | head -80 || true
              echo
              echo "--- tail ---"
              tail -n 40 build.log
            fi
          } > "$d/last-build.txt"
          cd "$d"
          git init -q -b ci-status
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last-build.txt
          git commit -qm "CI status for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-status
